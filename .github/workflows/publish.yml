name: Publish package and container

on:
  workflow_dispatch:
  push:
    branches:
      - '**'
    tags:
      - 'v*.*.*'
    paths:
      - 'paper_search_mcp/**'
      - 'tests/**'
      - 'Dockerfile'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'requirements.txt'
      - 'setup.sh'
      - 'README.md'
      - '.github/workflows/publish.yml'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: |
          bash setup.sh
          python -m pip install -e ".[dev]"

      - name: Run tests
        run: >
          python -m pytest
          tests/test_config_env.py
          tests/test_unpaywall.py
          tests/test_acm.py
          tests/test_ieee.py
          tests/test_package_entrypoints.py
          tests/test_search_papers_timeout.py
          tests/test_tool_allowlist.py
          tests/test_tool_schema_diet.py
          tests/test_dblp_errors.py
          tests/test_arxiv_rate_limit.py
          tests/test_published_date_types.py
          -x -q --tb=short

      - name: Build package
        run: uv build

      - name: Verify wheel entry points
        run: |
          python - <<'EOF'
          import pathlib, zipfile

          wheel = next(pathlib.Path("dist").glob("paper_search_mcp-*.whl"))
          with zipfile.ZipFile(wheel) as archive:
              name = next(n for n in archive.namelist() if n.endswith(".dist-info/entry_points.txt"))
              data = archive.read(name).decode()
          assert "paper-search-mcp = paper_search_mcp.server:main" in data, data
          assert "paper-search = paper_search_mcp.cli:main" in data, data
          print(data)
          EOF

      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/*

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download package artifacts
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist

      - name: Publish GitHub release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes "Automated package build for $GITHUB_REF_NAME"
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber

  container:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract container metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push container image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
